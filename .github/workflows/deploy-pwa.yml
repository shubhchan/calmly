name: Deploy Calmly PWA to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22 (Expo SDK 57)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure public env variables
        run: |
          if [ ! -f ".env" ]; then
            echo "EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyBBrsInGzDh9JsuQiv7vqiMUwvpF56vYLs" >> .env
            echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=calmly-f135f.firebaseapp.com" >> .env
            echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=calmly-f135f" >> .env
            echo "EXPO_PUBLIC_FIREBASE_APP_ID=1:417740727864:android:3dfc2615f9432afff668cd" >> .env
            echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=417740727864-obo3qs5la48s1u401hpu1r6vcljpc7bh.apps.googleusercontent.com" >> .env
          fi

      - name: Configure Expo baseUrl for GitHub Pages
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("./app.json", "utf8"));
            app.expo.experiments = { ...(app.expo.experiments || {}), baseUrl: "/calmly" };
            fs.writeFileSync("./app.json", JSON.stringify(app, null, 2));
          '

      - name: Export Calmly PWA
        run: npx expo export -p web

      - name: Prepare SPA routing fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

